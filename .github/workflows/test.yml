name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A superseded push should stop burning a runner. main is exempt so pushes
# there always produce a complete record.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd/)
          if [[ -n "$unformatted" ]]; then
            echo "::error::gofmt would reformat:"
            echo "$unformatted"
            exit 1
          fi

  desktop:
    name: Desktop
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: apps/desktop
        run: bunx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: apps/desktop
        run: bunx vitest run

  shell:
    name: Shell
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Install tools
        run: brew install bats-core shellcheck coreutils

      - name: Syntax check every script
        run: find bin lib -name '*.sh' -print0 | xargs -0 -n1 bash -n

      # The suites below pass today and are treated as required. The rest of
      # the bats suite runs in `shell-full` and is reported without blocking,
      # because roughly 50 of its 940 cases fail for reasons that predate this
      # workflow. Move files up here as they go green; a required check that is
      # permanently red teaches everyone to ignore it.
      - name: Required safety suites
        env:
          MOLE_TEST_NO_AUTH: '1'
        run: |
          bats --formatter tap \
            tests/core_safe_functions.bats \
            tests/path_validation_fuzz.bats \
            tests/bundle_resolver.bats \
            tests/uninstall_naming_variants.bats

  shell-full:
    name: Shell (full suite, reporting only)
    runs-on: macos-latest
    timeout-minutes: 40
    # Known-failing cases predate this workflow. This job exists to make the
    # count visible and to stop it drifting further, not to gate merges yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Install tools
        run: brew install bats-core shellcheck coreutils

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Full bats suite
        env:
          MOLE_TEST_NO_AUTH: '1'
        run: |
          set +e
          bats --formatter tap tests/*.bats > /tmp/bats.tap 2>&1
          set -e
          passed=$(grep -c '^ok' /tmp/bats.tap || true)
          failed=$(grep -c '^not ok' /tmp/bats.tap || true)
          echo "### Bats suite" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "passed: **$passed**, failed: **$failed**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$failed" -gt 0 ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep '^not ok' /tmp/bats.tap >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "passed=$passed failed=$failed"

      - name: Upload TAP output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bats-tap
          path: /tmp/bats.tap
          retention-days: 14

  security:
    name: Security
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      # Carried over verbatim from the archived Validation workflow. The filter
      # list is tuned and load-bearing, so it is reused rather than rewritten:
      #   safe_remove / validate_path: the audited wrapper helpers in file_ops.sh
      #   # SAFE: explicit annotation that a direct rm is gated by narrow checks
      #   ^path:line:<ws>#: comment lines that mention rm -rf in documentation
      #   echo: help text that prints rm -rf as an example
      # A naive `rm -f` match instead of this produced 69 hits, nearly all of
      # them legitimate temp-file cleanup.
      - name: Check for unsafe rm usage
        run: |
          if grep -rn "rm -rf" --include="*.sh" lib/ | grep -v -E "safe_remove|validate_path|# SAFE|^[^:]+:[0-9]+:[[:space:]]*#|echo "; then
            echo "::error::Unsafe rm -rf found. Route through safe_remove or annotate with '# SAFE: <reason>'."
            exit 1
          fi
          echo "no unsafe rm -rf usage"

      - name: Verify app protection
        run: |
          bash -c '
          source lib/core/common.sh
          if should_protect_from_uninstall "com.apple.Safari"; then
            echo "Safari is protected"
          else
            echo "::error::Safari protection failed"
            exit 1
          fi
          '

      - name: Protected-path guard is wired into mole_delete
        run: |
          grep -q "should_protect_path" lib/core/file_ops.sh \
            || { echo "::error::mole_delete no longer consults should_protect_path"; exit 1; }
          echo "protected-path guard present"
